<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dialogue-to-Duplex</title>
<style>body{font:18px system-ui,sans-serif;max-width:680px;margin:10vh auto;padding:24px;color:#1c2434;background:#fafafa}h1{font-size:40px}button{font:inherit;padding:12px 24px;border:0;border-radius:8px;background:#2849b8;color:white;cursor:pointer}button:disabled{opacity:.5}#status{color:#565d6b}#transcript{white-space:pre-wrap;line-height:1.6;min-height:160px}small{color:#565d6b}</style>
<h1>Dialogue-to-Duplex</h1><p>Talk naturally. You can speak while the assistant is talking.</p>
<p><button id="start">Start conversation</button> <button id="stop" disabled>Stop</button></p>
<p id="status">Ready</p><div id="transcript" aria-live="polite"></div>
<small>Use headphones to keep the assistant’s voice out of your microphone. Microphone access requires localhost or HTTPS.</small>
